<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Sisa Fisik</title>
    <meta name="description" content="Aplikasi pencatatan stok sisa fisik harian dengan pengiriman laporan cepat ke WhatsApp." />
    <meta property="og:title" content="Sisa Fisik" />
    <meta property="og:description" content="Aplikasi pencatatan stok sisa fisik harian dengan pengiriman laporan cepat ke WhatsApp." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style id="standalone-fallback-styles">
      :root {
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --spring: cubic-bezier(0.34, 1.45, 0.5, 1);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0;
        background: #f4f6fb;
        color: #0f172a;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
      }
      .sf-standalone { padding-top: 74px; padding-bottom: 100px; min-height: 100dvh; }
      .sf-wrap { max-width: 672px; margin: 0 auto; padding: 0 10px; }
      .sf-header {
        position: fixed; top: 0; left: 0; right: 0; z-index: 40;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        padding: 10px 0;
        box-shadow: 0 1px 2px rgba(15,23,42,0.03);
      }
      .sf-head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .sf-title-box { display: flex; align-items: center; gap: 8px; }
      .sf-title { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: #0f172a; }
      .sf-badge { font-size: 12px; font-weight: 800; color: #475569; font-variant-numeric: tabular-nums; transition: transform 0.35s var(--spring), color 0.25s; }
      .sf-badge.bump { transform: scale(1.22); color: #2563eb; }
      .sf-date { margin: 2px 0 0; font-size: 11.5px; font-weight: 600; color: #64748b; }
      .sf-actions { display: flex; align-items: center; gap: 10px; }
      .sf-btn {
        border: 0; outline: 0; font: inherit; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border-radius: 12px; font-weight: 800; font-size: 12px;
        transition: transform 0.2s var(--spring), background 0.2s, box-shadow 0.2s;
      }
      .sf-btn:active { transform: scale(0.93); }
      .sf-btn-reset {
        height: 36px; padding: 0 12px; background: #f8fafc; color: #334155;
        border: 1px solid #e2e8f0;
      }
      .sf-btn-add-top {
        height: 36px; padding: 0 14px; background: #2563eb; color: #fff;
        box-shadow: 0 2px 6px rgba(37,99,235,0.2);
      }
      .sf-prog { margin-top: 8px; height: 6px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
      .sf-prog-bar {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #2563eb, #6366f1, #10b981);
        border-radius: 99px;
        transition: width 0.45s var(--ease);
      }
      /* List Card */
      .sf-list-card {
        margin-top: 10px; background: #fff; border: 1px solid #e2e8f0;
        border-radius: 16px; box-shadow: 0 1px 3px rgba(15,23,42,0.03);
      }
      .sf-row {
        position: relative;
        display: flex; align-items: center; justify-content: space-between; gap: 6px;
        padding: 8px 10px; border-bottom: 1px solid #f1f5f9;
        transition: translate 0.38s var(--spring), scale 0.28s var(--spring), background 0.15s;
      }
      .sf-row:last-child { border-bottom: 0; }
      .sf-row.menu-open { z-index: 35 !important; }
      .sf-row.is-holding { scale: 0.985; background: #eff6ff !important; will-change: translate, scale; }
      .sf-row.is-dragging {
        z-index: 45 !important; scale: 1.025; background: #fff !important; border-radius: 16px !important;
        box-shadow: 0 24px 48px -12px rgba(15,23,42,0.24), 0 0 0 2px #2563eb !important;
        transition: scale 0.28s var(--spring), box-shadow 0.28s var(--ease) !important;
        will-change: translate, scale;
      }
      .sf-row.is-dropping {
        z-index: 40 !important;
        transition: translate 0.34s var(--spring), scale 0.28s var(--ease), box-shadow 0.28s var(--ease) !important;
        will-change: translate, scale;
      }
      .sf-row-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
      .sf-num {
        width: 24px; height: 24px; border-radius: 6px;
        background: #f1f5f9; border: 1px solid #e2e8f0; color: #0f172a;
        font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums;
        display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      }
      .sf-name-txt {
        font-size: 13.5px; font-weight: 700; color: #0f172a; line-height: 1.25;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .sf-check-badge {
        width: 18px; height: 18px; border-radius: 999px;
        background: linear-gradient(135deg, #10b981, #16a34a);
        color: #ffffff;
        display: none; align-items: center; justify-content: center; flex-shrink: 0;
        box-shadow: 0 2px 6px rgba(16, 185, 129, 0.35), 0 0 0 2px #ecfdf5;
        animation: sfCheckPop 0.3s var(--spring);
      }
      .sf-row.filled .sf-check-badge { display: inline-flex; }
      @keyframes sfCheckPop {
        from { transform: scale(0) rotate(-25deg); opacity: 0; }
        to { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      .sf-right-box { display: flex; align-items: center; justify-content: flex-end; gap: 2px; flex-shrink: 0; }
      .sf-slots { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
      .sf-plus-sep { font-size: 12px; font-weight: 800; color: #cbd5e1; user-select: none; }
      .sf-input-box {
        display: inline-flex; align-items: center; justify-content: space-between;
        height: 36px; width: 112px;
        padding: 0 6px; border: 0;
        border-radius: 8px; background: transparent;
        cursor: text; transition: background 0.15s;
      }
      .sf-input-box.two { width: 78px; }
      .sf-input-box:focus-within {
        background: rgba(241,245,249,0.85);
      }
      .sf-input-box.has-val {
        background: rgba(241,245,249,0.7);
      }
      .sf-val-inp {
        flex: 1; min-width: 0; width: 100%; border: 0; outline: 0; background: transparent;
        text-align: center; font: inherit; font-size: 17px; font-weight: 800; color: #0f172a;
        font-variant-numeric: tabular-nums;
      }
      .sf-val-inp::placeholder { color: #cbd5e1; }
      .sf-unit-lbl {
        margin-left: 4px;
        color: #0f172a;
        font-size: 14.5px; font-weight: 800; user-select: none; white-space: nowrap; flex-shrink: 0;
      }
      /* 3-dots button & popover */
      .sf-more-wrap { position: relative; }
      .sf-more-btn {
        width: 26px; height: 32px; border-radius: 8px; border: 0; background: transparent;
        color: #94a3b8; font-size: 17px; font-weight: 800; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
      }
      .sf-more-btn:hover, .sf-more-btn.active { background: #dbeafe; color: #1d4ed8; }
      .sf-popover {
        position: absolute; right: 0; top: 36px; z-index: 60;
        width: 140px; background: #fff; border: 1px solid #e2e8f0;
        border-radius: 12px; box-shadow: 0 14px 32px rgba(15,23,42,0.18);
        overflow: hidden; animation: sfPopIn 0.14s var(--spring);
      }
      .sf-popover.up { top: auto; bottom: 36px; }
      .sf-pop-item {
        width: 100%; padding: 10px 14px; border: 0; background: transparent;
        text-align: left; font: inherit; font-size: 12.5px; font-weight: 800;
        color: #1e293b; cursor: pointer; display: flex; align-items: center; gap: 8px;
      }
      .sf-pop-item:hover { background: #eff6ff; color: #2563eb; }
      .sf-pop-item.danger { color: #e11d48; border-top: 1px solid #f1f5f9; }
      .sf-pop-item.danger:hover { background: #fff1f2; }
      /* Single-Item Inline Edit Row */
      .sf-row-editing {
        display: block; padding: 14px; background: rgba(239,246,255,0.55);
        border: 2px solid #3b82f6; border-radius: 14px;
      }
      .sf-edit-top { display: flex; align-items: center; gap: 8px; }
      .sf-grip {
        height: 40px; padding: 0 10px; border-radius: 12px;
        background: #fff; border: 2px solid #bfdbfe; color: #1e293b;
        display: inline-flex; align-items: center; gap: 4px;
        cursor: grab; user-select: none; touch-action: none; flex-shrink: 0;
        font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums;
      }
      .sf-grip:active { cursor: grabbing; background: #2563eb; color: #fff; border-color: #2563eb; }
      .sf-name-inp {
        flex: 1; min-width: 0; height: 40px; padding: 0 12px;
        border-radius: 12px; background: #fff; border: 2px solid #60a5fa;
        font: inherit; font-size: 16px; font-weight: 800; color: #0f172a; outline: 0;
      }
      .sf-del-btn {
        width: 40px; height: 40px; border-radius: 12px;
        background: #fff1f2; border: 1px solid #fecdd3; color: #e11d48;
        display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;
      }
      .sf-done-inline {
        height: 40px; padding: 0 14px; border-radius: 12px; border: 0;
        background: #2563eb; color: #fff; font: inherit; font-size: 12px; font-weight: 800;
        cursor: pointer; flex-shrink: 0;
      }
      .sf-edit-units {
        margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(191,219,254,0.6);
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
      }
      .sf-unit-chip {
        display: inline-flex; align-items: center; height: 32px;
        border-radius: 12px; background: #fff; border: 1px solid #cbd5e1; overflow: hidden;
      }
      .sf-unit-chip-btn {
        border: 0; background: transparent; height: 100%; padding: 0 12px;
        font: inherit; font-size: 13px; font-weight: 800; color: #1d4ed8; cursor: pointer;
      }
      .sf-unit-chip-rm {
        border: 0; border-left: 1px solid #cbd5e1; background: transparent;
        height: 100%; padding: 0 8px; color: #475569; cursor: pointer; font-weight: 800;
      }
      .sf-add-unit-btn {
        height: 32px; padding: 0 12px; border-radius: 12px;
        background: #fff; border: 1px solid #93c5fd; color: #1d4ed8;
        font: inherit; font-size: 12px; font-weight: 800; cursor: pointer;
      }
      /* Dock */
      .sf-dock {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
        background: rgba(255,255,255,0.95); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
        border-top: 1px solid #e2e8f0; padding: 10px 14px;
      }
      .sf-dock-inner { max-width: 672px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
      .sf-btn-wa {
        flex: 1; height: 44px; border-radius: 14px;
        background: linear-gradient(135deg, #059669, #0d9488); color: #fff;
        font-size: 14px; box-shadow: 0 4px 14px rgba(5,150,105,0.25);
      }
      .sf-btn-sec {
        height: 44px; padding: 0 14px; border-radius: 14px;
        background: #f8fafc; border: 1px solid #e2e8f0; color: #334155; font-size: 13px;
      }
      /* Modal */
      .sf-modal-backdrop {
        position: fixed; inset: 0; z-index: 60;
        background: rgba(15,23,42,0.45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
        display: flex; align-items: center; justify-content: center; padding: 16px;
        animation: sfFadeIn 0.18s ease;
      }
      .sf-modal-card {
        background: #fff; border: 1px solid #e2e8f0; border-radius: 24px;
        width: 100%; max-width: 380px; padding: 20px;
        box-shadow: 0 24px 48px rgba(15,23,42,0.2);
        animation: sfPopIn 0.28s var(--spring);
      }
      @keyframes sfFadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sfPopIn { from { opacity: 0; transform: scale(0.88) translateY(16px); } to { opacity: 1; transform: none; } }
      .sf-unit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
      .sf-unit-pick {
        height: 48px; border-radius: 16px; border: 2px solid #e2e8f0;
        background: #f8fafc; color: #0f172a; font: inherit; font-size: 14px; font-weight: 800;
        cursor: pointer; transition: transform 0.15s var(--spring), background 0.15s, color 0.15s;
      }
      .sf-unit-pick:hover, .sf-unit-pick:active { background: #2563eb; border-color: #2563eb; color: #fff; transform: scale(0.96); }
      .sf-toast {
        position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%); z-index: 70;
        background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 14px;
        font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__initStandaloneApp = function () {
        if (window.__VITE_ACTIVE__ || window.__STANDALONE_MOUNTED__) return;
        window.__STANDALONE_MOUNTED__ = true;

        var LS_KEY = 'sisa-fisik:v2';
        var ALLOWED_UNITS = ['Pack', 'Porsi', 'Pcs', 'Kg', 'Gram', 'Botol'];
        var normUnit = function (u) {
          var c = String(u || '').trim().toLowerCase();
          if (c === 'pack' || c === 'pak') return 'Pack';
          if (c === 'porsi') return 'Porsi';
          if (c === 'pcs' || c === 'lembar' || c === 'buah') return 'Pcs';
          if (c === 'kg' || c === 'kilo') return 'Kg';
          if (c === 'gram' || c === 'gr' || c === 'g') return 'Gram';
          if (c === 'botol' || c === 'btl') return 'Botol';
          return 'Pack';
        };
        var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };
        var mk = function (name) {
          var units = Array.prototype.slice.call(arguments, 1, 3);
          return { id: uid(), name: name, slots: units.map(function (u) { return { v: '', u: normUnit(u) }; }) };
        };
        var getDefaults = function () {
          return [
            mk('Karage', 'Pack'), mk('Sayap', 'Pack', 'Porsi'), mk('Ayam filet', 'Porsi'),
            mk('Ayam kecil', 'Pack', 'Porsi'), mk('Ayam besar', 'Pack', 'Porsi'), mk('Ebi', 'Pcs'),
            mk('Timun', 'Pcs'), mk('Crabstik', 'Pack'), mk('Koslow', 'Porsi'), mk('Selada', 'Kg'),
            mk('Saos Black paper', 'Pack'), mk('Saos teriyaki', 'Pack'), mk('Saos Asam manis', 'Botol'),
            mk('Saos pedas', 'Pack'), mk('Cuka', 'Botol'), mk('Kwipie', 'Pack'), mk('Mestro', 'Pack'),
            mk('Mentai', 'Pack'), mk('Wijen', 'Pack'), mk('Minyak', 'Pack'), mk('Tobiko', 'Pack'),
            mk('Ricepaper', 'Pcs'), mk('Mika', 'Pcs'), mk('Cup(35)', 'Pcs'),
            mk('Sambal horeg', 'Porsi'), mk('Nasi', 'Kg', 'Porsi'), mk('Nori', 'Pack', 'Pcs'),
            mk('Klip besar', 'Pack', 'Pcs'), mk('Klip sedang', 'Pack', 'Pcs'),
            mk('Klip kecil', 'Pcs'), mk('Tepung wfc', 'Pack')
          ];
        };
        var toDateVal = function (d) {
          d = d || new Date();
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        };
        var formatDateId = function (ymd) {
          var p = String(ymd || toDateVal()).split('-');
          var dt = new Date(Number(p[0]), Number(p[1] || 1) - 1, Number(p[2] || 1));
          return dt.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        };
        var isFilled = function (it) {
          return it.slots.some(function (s) { return s.v.trim() !== ''; });
        };

        var items = getDefaults();
        try {
          var raw = localStorage.getItem(LS_KEY) || localStorage.getItem('sisa-fisik:v1');
          if (raw) {
            var p = JSON.parse(raw);
            if (p && Array.isArray(p.items)) {
              items = p.items.map(function (i) {
                return {
                  id: String(i.id || uid()),
                  name: String(i.name || 'Barang'),
                  slots: (Array.isArray(i.slots) && i.slots.length ? i.slots : [{ v: '', u: 'Pack' }]).slice(0, 2).map(function (s) {
                    return { v: String((s && s.v) || ''), u: normUnit((s && s.u) || 'Pack') };
                  })
                };
              });
            }
          }
        } catch (e) {}

        var save = function () {
          try { localStorage.setItem(LS_KEY, JSON.stringify({ items: items, theme: 'light', day: toDateVal() })); } catch (e) {}
        };

        var editingId = null;
        var openMenuId = null;
        var root = document.getElementById('root');

        window.addEventListener('click', function () {
          if (openMenuId) { openMenuId = null; render(); }
        });

        var buildReport = function (dateStr) {
          var head = '*Sisa Fisik* – ' + formatDateId(dateStr || toDateVal());
          var lines = items.map(function (it) {
            var parts = it.slots.filter(function (s) { return s.v.trim() !== ''; }).map(function (s) {
              return s.v.trim() + (s.u.trim() ? ' ' + s.u.trim() : '');
            });
            return (it.name.trim() || 'Barang') + ' = ' + (parts.length ? parts.join(' + ') : '-');
          });
          return head + '\n\n' + lines.join('\n');
        };

        var showToast = function (msg, undoFn) {
          var old = document.querySelector('.sf-toast');
          if (old) old.remove();
          var t = document.createElement('div');
          t.className = 'sf-toast';
          t.innerHTML = '<span>' + msg + '</span>';
          if (undoFn) {
            var b = document.createElement('button');
            b.style.cssText = 'border:0;background:none;color:#60a5fa;font-weight:800;cursor:pointer;text-decoration:underline';
            b.textContent = 'Urungkan';
            b.onclick = function () { undoFn(); t.remove(); render(); };
            t.appendChild(b);
          }
          document.body.appendChild(t);
          setTimeout(function () { if (t.parentNode) t.remove(); }, undoFn ? 4500 : 2400);
        };

        var openResetConfirmPopup = function () {
          var bd = document.createElement('div');
          bd.className = 'sf-modal-backdrop';
          var card = document.createElement('div');
          card.className = 'sf-modal-card';
          card.innerHTML =
            '<h3 style="margin:0 0 8px;font-size:16px;font-weight:800;color:#0f172a;line-height:1.35">Apakah anda yakin hapus data angka yang terisi?</h3>' +
            '<p style="margin:0 0 18px;font-size:12.5px;color:#475569;line-height:1.5">Semua angka stok yang sudah diisi akan dikosongkan kembali menjadi 0. Daftar nama barang dan satuan tetap aman tersimpan.</p>' +
            '<div style="display:flex;gap:8px">' +
            '<button type="button" class="sf-cancel" style="flex:1;height:40px;border-radius:12px;border:1px solid #e2e8f0;background:#f1f5f9;color:#334155;font:inherit;font-weight:700;cursor:pointer">Batal</button>' +
            '<button type="button" class="sf-confirm" style="flex:1;height:40px;border-radius:12px;border:0;background:#e11d48;color:#fff;font:inherit;font-weight:800;cursor:pointer">Ya, Hapus</button></div>';
          card.querySelector('.sf-cancel').onclick = function () { bd.remove(); };
          card.querySelector('.sf-confirm').onclick = function () {
            items.forEach(function (it) { it.slots.forEach(function (s) { s.v = ''; }); });
            save(); bd.remove(); render();
            showToast('Data angka berhasil dihapus');
          };
          bd.onclick = function (e) { if (e.target === bd) bd.remove(); };
          bd.appendChild(card);
          document.body.appendChild(bd);
        };

        var openUnitPopup = function (item, mode, slotIndex) {
          var bd = document.createElement('div');
          bd.className = 'sf-modal-backdrop';
          var card = document.createElement('div');
          card.className = 'sf-modal-card';
          card.innerHTML =
            '<div style="display:flex;justify-content:space-between;align-items:center">' +
            '<div><h3 style="margin:0;font-size:16px;font-weight:800">' + (mode === 'add' ? 'Pilih Satuan Kolom ke-2' : 'Pilih Satuan') + '</h3>' +
            '<p style="margin:2px 0 0;font-size:12px;color:#64748b">Barang: <b style="color:#0f172a">' + item.name + '</b></p></div>' +
            '<button class="sf-close" style="border:0;background:#f1f5f9;width:32px;height:32px;border-radius:10px;cursor:pointer;font-weight:800">✕</button></div>' +
            '<div class="sf-unit-grid"></div>';
          var grid = card.querySelector('.sf-unit-grid');
          var pick = function (u) {
            if (mode === 'add') {
              if (item.slots.length < 2) item.slots.push({ v: '', u: u });
            } else {
              item.slots[slotIndex].u = u;
            }
            save(); bd.remove(); render();
          };
          ALLOWED_UNITS.forEach(function (u) {
            var b = document.createElement('button');
            b.className = 'sf-unit-pick';
            b.textContent = u;
            b.onclick = function () { pick(u); };
            grid.appendChild(b);
          });
          card.querySelector('.sf-close').onclick = function () { bd.remove(); };
          bd.onclick = function (e) { if (e.target === bd) bd.remove(); };
          bd.appendChild(card);
          document.body.appendChild(bd);
        };

        var WA_GROUP_URL = 'https://chat.whatsapp.com/JYWpwt77Xc30ATcKuiCWlP?s=cl&p=a&mlu=4&ilr=4&iam=2';
        var copyGuaranteed = function (text) {
          try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
            document.body.appendChild(ta);
            ta.select();
            ta.setSelectionRange(0, text.length);
            document.execCommand('copy');
            ta.remove();
          } catch (e) {}
          try { if (navigator.clipboard) navigator.clipboard.writeText(text); } catch (e) {}
        };

        var openDatePopupAndSend = function () {
          var chosenDate = toDateVal();
          var bd = document.createElement('div');
          bd.className = 'sf-modal-backdrop';
          var card = document.createElement('div');
          card.className = 'sf-modal-card';
          card.innerHTML =
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
            '<h3 style="margin:0;font-size:16px;font-weight:800">Pilih Tanggal Laporan</h3>' +
            '<button class="sf-close" style="border:0;background:#f1f5f9;width:32px;height:32px;border-radius:10px;cursor:pointer;font-weight:800">✕</button></div>' +
            '<label style="display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:6px">Pilih Tanggal:</label>' +
            '<input id="sf-date-inp" type="date" value="' + chosenDate + '" style="width:100%;height:42px;padding:0 12px;border-radius:12px;border:1px solid #cbd5e1;font:inherit;font-size:14px;font-weight:800;margin-bottom:12px">' +
            '<div style="padding:10px 12px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;margin-bottom:16px">' +
            '<div id="sf-date-prev" style="font-size:12px;font-weight:800;color:#1e293b"></div>' +
            '<div style="font-size:11px;font-weight:600;color:#047857;margin-top:4px">Teks laporan otomatis disalin & langsung membuka Grup WhatsApp.</div></div>' +
            '<div style="display:flex;gap:8px">' +
            '<button type="button" class="sf-cancel" style="height:42px;padding:0 16px;border-radius:12px;border:1px solid #e2e8f0;background:#f1f5f9;font:inherit;font-weight:700;cursor:pointer">Batal</button>' +
            '<button type="button" class="sf-send-now" style="flex:1;height:42px;border-radius:12px;border:0;background:linear-gradient(135deg,#059669,#0d9488);color:#fff;font:inherit;font-weight:800;cursor:pointer">Kirim ke WhatsApp</button></div>';

          var inp = card.querySelector('#sf-date-inp');
          var prev = card.querySelector('#sf-date-prev');
          var upd = function () {
            chosenDate = inp.value || toDateVal();
            prev.textContent = '*Sisa Fisik* – ' + formatDateId(chosenDate);
          };
          inp.onchange = upd;
          upd();

          card.querySelector('.sf-close').onclick = function () { bd.remove(); };
          card.querySelector('.sf-cancel').onclick = function () { bd.remove(); };
          card.querySelector('.sf-send-now').onclick = function () {
            var msg = buildReport(chosenDate);
            copyGuaranteed(msg);
            bd.remove();
            showToast('Teks laporan otomatis disalin! Tinggal Tempel (Paste) di grup.');
            var a = document.createElement('a');
            a.href = WA_GROUP_URL;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            a.remove();
          };
          bd.onclick = function (e) { if (e.target === bd) bd.remove(); };
          bd.appendChild(card);
          document.body.appendChild(bd);
        };

        var openAddItemModal = function () {
          var bd = document.createElement('div');
          bd.className = 'sf-modal-backdrop';
          var selectedUnit = 'Pack';
          var card = document.createElement('div');
          card.className = 'sf-modal-card';
          card.innerHTML =
            '<h3 style="margin:0 0 12px;font-size:16px;font-weight:800">Tambah Barang Baru</h3>' +
            '<label style="display:block;font-size:12px;font-weight:700;margin-bottom:4px">Nama Barang</label>' +
            '<input id="sf-new-name" type="text" placeholder="Contoh: Saos Tomat" style="width:100%;height:40px;padding:0 12px;border-radius:12px;border:1px solid #cbd5e1;font:inherit;font-size:14px;font-weight:700;margin-bottom:12px">' +
            '<label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px">Pilih Satuan</label>' +
            '<div class="sf-u-choices" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px"></div>' +
            '<div style="display:flex;gap:8px">' +
            '<button type="button" class="sf-cancel" style="flex:1;height:40px;border-radius:12px;border:1px solid #e2e8f0;background:#f1f5f9;font:inherit;font-weight:700;cursor:pointer">Batal</button>' +
            '<button type="button" class="sf-save" style="flex:1;height:40px;border-radius:12px;border:0;background:#2563eb;color:#fff;font:inherit;font-weight:800;cursor:pointer">Simpan</button></div>';
          var uBox = card.querySelector('.sf-u-choices');
          var renderChoices = function () {
            uBox.innerHTML = '';
            ALLOWED_UNITS.forEach(function (u) {
              var b = document.createElement('button');
              b.type = 'button';
              var act = selectedUnit === u;
              b.style.cssText = 'height:36px;border-radius:10px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;border:1px solid ' + (act ? '#2563eb' : '#e2e8f0') + ';background:' + (act ? '#2563eb' : '#fff') + ';color:' + (act ? '#fff' : '#1e293b');
              b.textContent = u;
              b.onclick = function () { selectedUnit = u; renderChoices(); };
              uBox.appendChild(b);
            });
          };
          renderChoices();
          card.querySelector('.sf-cancel').onclick = function () { bd.remove(); };
          card.querySelector('.sf-save').onclick = function () {
            var inp = card.querySelector('#sf-new-name');
            var name = inp.value.trim();
            if (!name) { inp.focus(); return; }
            items.push({ id: uid(), name: name, slots: [{ v: '', u: selectedUnit }] });
            save(); bd.remove(); render();
            showToast('"' + name + '" ditambahkan');
          };
          bd.onclick = function (e) { if (e.target === bd) bd.remove(); };
          bd.appendChild(card);
          document.body.appendChild(bd);
          setTimeout(function () { card.querySelector('#sf-new-name').focus(); }, 60);
        };

        var updateHeaderStats = function () {
          var done = items.filter(isFilled).length;
          var tot = items.length;
          var badge = document.getElementById('sf-stat-badge');
          var bar = document.getElementById('sf-prog-bar');
          var waCount = document.getElementById('sf-wa-count');
          if (badge) {
            badge.textContent = done + '/' + tot + ' terisi';
            badge.classList.remove('bump');
            void badge.offsetWidth;
            badge.classList.add('bump');
          }
          if (bar) bar.style.width = (tot ? Math.round((done / tot) * 100) : 0) + '%';
          if (waCount) waCount.textContent = done + '/' + tot;
        };

        var render = function () {
          var done = items.filter(isFilled).length;
          var tot = items.length;
          var pct = tot ? Math.round((done / tot) * 100) : 0;

          root.innerHTML =
            '<div class="sf-standalone">' +
            '<header class="sf-header"><div class="sf-wrap">' +
            '<div class="sf-head-row">' +
            '<div><div class="sf-title-box"><h1 class="sf-title">Sisa Fisik</h1>' +
            '<span class="sf-badge" id="sf-stat-badge">' + done + '/' + tot + ' terisi</span></div>' +
            '<p class="sf-date">' + formatDateId(toDateVal()) + '</p></div>' +
            '<div class="sf-actions">' +
            '<button class="sf-btn sf-btn-reset" id="sf-reset-btn">Reset</button>' +
            '<button class="sf-btn sf-btn-add-top" id="sf-add-top-btn">+ Barang</button>' +
            '</div>' +
            '</div>' +
            '<div class="sf-prog"><div class="sf-prog-bar" id="sf-prog-bar" style="width:' + pct + '%"></div></div>' +
            '</div></header>' +
            '<main class="sf-wrap" id="sf-main"></main>' +
            '<div class="sf-dock"><div class="sf-dock-inner" id="sf-dock-inner"></div></div>' +
            '</div>';

          document.getElementById('sf-reset-btn').onclick = openResetConfirmPopup;
          document.getElementById('sf-add-top-btn').onclick = openAddItemModal;

          var main = document.getElementById('sf-main');
          var listCard = document.createElement('div');
          listCard.className = 'sf-list-card';

          items.forEach(function (item, idx) {
            if (editingId === item.id) {
              var ec = document.createElement('div');
              ec.className = 'sf-row sf-row-editing';
              ec.innerHTML =
                '<div class="sf-edit-top">' +
                '<div class="sf-grip" title="Tahan & geser untuk ubah posisi urutan"><span>⠿</span><span>' + (idx + 1) + '</span></div>' +
                '<input class="sf-name-inp" type="text">' +
                '<button class="sf-del-btn" title="Hapus">🗑</button>' +
                '<button class="sf-done-inline">✓ Selesai</button></div>' +
                '<div class="sf-edit-units"><div class="sf-u-left" style="display:flex;flex-wrap:wrap;align-items:center;gap:6px"></div>' +
                '<span style="font-size:11px;font-weight:700;color:#1d4ed8">Tahan nomor di kiri untuk geser posisi</span></div>';
              var nameInp = ec.querySelector('.sf-name-inp');
              nameInp.value = item.name;
              nameInp.oninput = function () { item.name = nameInp.value; save(); };
              ec.querySelector('.sf-del-btn').onclick = function () {
                editingId = null;
                var removed = items.splice(idx, 1)[0];
                save(); render();
                showToast('"' + removed.name + '" dihapus', function () { items.splice(idx, 0, removed); save(); });
              };
              ec.querySelector('.sf-done-inline').onclick = function () {
                if (!item.name.trim()) item.name = 'Barang';
                editingId = null; save(); render();
              };
              var uRow = ec.querySelector('.sf-u-left');
              item.slots.forEach(function (slot, sIdx) {
                var chip = document.createElement('div');
                chip.className = 'sf-unit-chip';
                var cBtn = document.createElement('button');
                cBtn.className = 'sf-unit-chip-btn';
                cBtn.textContent = '#' + (sIdx + 1) + ' ' + (slot.u.trim() || 'Pack');
                cBtn.onclick = function () { openUnitPopup(item, 'edit', sIdx); };
                chip.appendChild(cBtn);
                if (item.slots.length > 1) {
                  var rm = document.createElement('button');
                  rm.className = 'sf-unit-chip-rm';
                  rm.textContent = '✕';
                  rm.onclick = function () { item.slots.splice(sIdx, 1); save(); render(); };
                  chip.appendChild(rm);
                }
                uRow.appendChild(chip);
              });
              if (item.slots.length < 2) {
                var addU = document.createElement('button');
                addU.className = 'sf-add-unit-btn';
                addU.textContent = '+ Tambah Satuan';
                addU.onclick = function () { openUnitPopup(item, 'add'); };
                uRow.appendChild(addU);
              }

              var grip = ec.querySelector('.sf-grip');
              grip.onpointerdown = function (e) {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                var startY = e.clientY;
                var pid = e.pointerId;
                ec.classList.add('is-holding');
                var holdT = setTimeout(function () {
                  var els = Array.prototype.slice.call(listCard.children);
                  var from = els.indexOf(ec);
                  var sy = window.scrollY;
                  var rects = els.map(function (c) { return c.getBoundingClientRect(); });
                  var tops = rects.map(function (r) { return r.top + sy; });
                  var hs = rects.map(function (r) { return r.height; });
                  var target = from;
                  ec.classList.remove('is-holding');
                  ec.classList.add('is-dragging');
                  try { grip.setPointerCapture(pid); } catch (_) {}

                  var onMove = function (ev) {
                    ev.preventDefault();
                    var rawDy = (ev.clientY - startY) + (window.scrollY - sy);
                    var last = els.length - 1;
                    var dy = Math.max(tops[0] - tops[from], Math.min((tops[last] + hs[last]) - (tops[from] + hs[from]), rawDy));
                    ec.style.translate = '0 ' + dy + 'px';
                    var center = tops[from] + hs[from] / 2 + dy;
                    var nt = from;
                    for (var j = from + 1; j < els.length; j++) if (center > tops[j] + hs[j] / 2) nt = j;
                    for (var k = from - 1; k >= 0; k--) if (center < tops[k] + hs[k] / 2) nt = k;
                    if (nt !== target) {
                      target = nt;
                      var shift = hs[from];
                      els.forEach(function (c, m) {
                        if (m === from) return;
                        var off = 0;
                        if (target > from && m > from && m <= target) off = -shift;
                        else if (target < from && m >= target && m < from) off = shift;
                        c.style.translate = off ? '0 ' + off + 'px' : '';
                      });
                    }
                  };
                  var onEnd = function () {
                    grip.removeEventListener('pointermove', onMove);
                    grip.removeEventListener('pointerup', onEnd);
                    grip.removeEventListener('pointercancel', onEnd);
                    ec.classList.remove('is-dragging');
                    ec.classList.add('is-dropping');
                    var finalY = target > from ? tops[target] + hs[target] - hs[from] - tops[from] : target < from ? tops[target] - tops[from] : 0;
                    ec.style.translate = '0 ' + finalY + 'px';
                    setTimeout(function () {
                      if (target !== from) {
                        var moved = items.splice(from, 1)[0];
                        items.splice(target, 0, moved);
                        save();
                      }
                      render();
                    }, 320);
                  };
                  grip.addEventListener('pointermove', onMove);
                  grip.addEventListener('pointerup', onEnd);
                  grip.addEventListener('pointercancel', onEnd);
                }, 150);
                var cancelHold = function () {
                  clearTimeout(holdT);
                  ec.classList.remove('is-holding');
                  grip.removeEventListener('pointerup', cancelHold);
                  grip.removeEventListener('pointercancel', cancelHold);
                };
                grip.addEventListener('pointerup', cancelHold);
                grip.addEventListener('pointercancel', cancelHold);
              };

              listCard.appendChild(ec);
              return;
            }

            var isMenuOpen = openMenuId === item.id;
            var openUp = idx >= items.length - 2 && items.length > 3;
            var row = document.createElement('div');
            row.className = 'sf-row' + (isFilled(item) ? ' filled' : '') + (isMenuOpen ? ' menu-open' : '');
            row.innerHTML =
              '<div class="sf-row-left">' +
              '<span class="sf-num">' + (idx + 1) + '</span>' +
              '<span class="sf-name-txt"></span>' +
              '<span class="sf-check-badge" title="Sudah terisi"><svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.3L6.6 11.4L12.6 4.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
              '</div>' +
              '<div class="sf-right-box"><div class="sf-slots"></div><div class="sf-more-wrap"></div></div>';
            row.querySelector('.sf-name-txt').textContent = item.name;
            var slotsBox = row.querySelector('.sf-slots');
            item.slots.forEach(function (slot, sIdx) {
              if (sIdx > 0) {
                var sep = document.createElement('span');
                sep.className = 'sf-plus-sep';
                sep.textContent = '+';
                slotsBox.appendChild(sep);
              }
              var lbl = document.createElement('label');
              lbl.className = 'sf-input-box' + (item.slots.length > 1 ? ' two' : '') + (slot.v.trim() !== '' ? ' has-val' : '');
              var inp = document.createElement('input');
              inp.type = 'text'; inp.inputMode = 'decimal'; inp.placeholder = '0';
              inp.className = 'sf-val-inp'; inp.value = slot.v;
              inp.oninput = function () {
                slot.v = inp.value;
                lbl.classList.toggle('has-val', slot.v.trim() !== '');
                row.classList.toggle('filled', isFilled(item));
                save(); updateHeaderStats();
              };
              inp.onkeydown = function (e) {
                if (e.key === 'Enter') {
                  e.preventDefault();
                  var all = Array.prototype.slice.call(listCard.querySelectorAll('.sf-val-inp'));
                  var next = all[all.indexOf(inp) + 1];
                  if (next) { next.focus(); next.select(); } else inp.blur();
                }
              };
              lbl.appendChild(inp);
              if (slot.u.trim() !== '') {
                var uSpan = document.createElement('span');
                uSpan.className = 'sf-unit-lbl';
                uSpan.textContent = slot.u;
                lbl.appendChild(uSpan);
              }
              slotsBox.appendChild(lbl);
            });

            var moreWrap = row.querySelector('.sf-more-wrap');
            var moreBtn = document.createElement('button');
            moreBtn.className = 'sf-more-btn' + (isMenuOpen ? ' active' : '');
            moreBtn.textContent = '⋮';
            moreBtn.onclick = function (e) {
              e.stopPropagation();
              openMenuId = openMenuId === item.id ? null : item.id;
              render();
            };
            moreWrap.appendChild(moreBtn);

            if (isMenuOpen) {
              var pop = document.createElement('div');
              pop.className = 'sf-popover' + (openUp ? ' up' : '');
              pop.onclick = function (e) { e.stopPropagation(); };
              var edBtn = document.createElement('button');
              edBtn.className = 'sf-pop-item';
              edBtn.innerHTML = '<span>✎</span><span>Edit</span>';
              edBtn.onclick = function () {
                openMenuId = null;
                editingId = item.id;
                render();
              };
              var delB = document.createElement('button');
              delB.className = 'sf-pop-item danger';
              delB.innerHTML = '<span>🗑</span><span>Hapus</span>';
              delB.onclick = function () {
                openMenuId = null;
                var removed = items.splice(idx, 1)[0];
                save(); render();
                showToast('"' + removed.name + '" dihapus', function () { items.splice(idx, 0, removed); save(); });
              };
              pop.appendChild(edBtn);
              pop.appendChild(delB);
              moreWrap.appendChild(pop);
            }

            listCard.appendChild(row);
          });
          main.appendChild(listCard);

          var dock = document.getElementById('sf-dock-inner');
          dock.innerHTML =
            '<button class="sf-btn sf-btn-sec" id="sf-copy-btn">Salin</button>' +
            '<button class="sf-btn sf-btn-wa" id="sf-wa-btn"><span>Kirim ke WhatsApp</span><span id="sf-wa-count" style="font-size:12px;background:rgba(0,0,0,0.16);padding:2px 8px;border-radius:8px">' + done + '/' + tot + '</span></button>';
          document.getElementById('sf-copy-btn').onclick = function () {
            try { navigator.clipboard.writeText(buildReport(toDateVal())); showToast('Teks laporan berhasil disalin!'); } catch (e) {}
          };
          document.getElementById('sf-wa-btn').onclick = openDatePopupAndSend;
        };

        render();
      };
    </script>
    <script
      type="module"
      src="./src/main.tsx"
      onerror="window.__initStandaloneApp && window.__initStandaloneApp()"
    ></script>
    <script>
      setTimeout(function () {
        if (!window.__VITE_ACTIVE__ && window.__initStandaloneApp) {
          window.__initStandaloneApp();
        }
      }, 300);
    </script>
  </body>
</html>
